name: CI (build)

on:
  push:
    branches: [develop]
  pull_request:
    # `labeled` lets the all-boards label start a run without a new push.
    # Adding any label, even on a closed PR, starts a full run. Removing a
    # label starts none, and re-runs reuse the original labels.
    types: [opened, synchronize, reopened, labeled]

# A new push to a PR cancels its run in progress. Other events queue behind
# it instead, since cancelling fails Test Status on that SHA; a newer queued
# run replaces an older queued one. Re-runs get their own group so a re-run of
# an old commit cannot replace the current head's queued run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}${{ github.run_attempt > 1 && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' && github.run_attempt == 1 }}

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-cppcheck-x4c-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: pio-v3-${{ runner.os }}-cppcheck-x4c-

      - name: Install cppcheck runtime dependency
        run: |
          # pioarduino's Linux cppcheck binary links against libpcre.so.3.
          # In newer Ubuntu runner images where libpcre3 is omitted from apt sources,
          # download from Ubuntu archive over HTTPS and verify SHA-256 before installation.
          sudo apt-get update
          if ! sudo apt-get install -y --no-install-recommends libpcre3; then
            PKG="libpcre3_8.39-13ubuntu0.22.04.1_amd64.deb"
            SHA256="0d1eb051047eb0c637c893f618f45e1d419863bfa3bc821897ee05ad418ba22e"
            wget -q "https://security.ubuntu.com/ubuntu/pool/main/p/pcre3/${PKG}"
            echo "${SHA256}  ${PKG}" | sha256sum -c -
            sudo dpkg -i "${PKG}"
            rm -f "${PKG}"
          fi

      - name: Run cppcheck
        run: pio check -e x4c --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  clang-tidy:
    name: clang-tidy (${{ matrix.shard }}/2)
    # The compile database is made with the image's Clang (18), like the Clang unit-test build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every source on one four-core runner takes about 8 minutes.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install clang-tidy-21
        run: pip install clang-tidy==21.1.6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake zlib1g-dev

      - name: Run clang-tidy
        run: ./bin/clang-tidy-check --shard ${{ matrix.shard }}/2

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The owner's device, x4c (X4 Classic), builds on every run. The rest
        # build only on PRs with the all-boards label, for example before
        # sending work upstream. pr-firmware-comment.js assumes x4c always builds.
        env: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'all-boards') && '["x4c","default","sticky","x4pro","papermono","metalio_eink4","eego_a4","picco","onepage"]' || '["x4c"]') }}
    env:
      # Short board-specific names keep pull-request artifacts easy to identify.
      # The release workflow applies the published crosspoint-<version>-<device>.bin names.
      ASSET: ${{ matrix.env == 'default' && 'firmware.bin' || format('firmware-{0}.bin', matrix.env) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: pio-v3-${{ runner.os }}-${{ matrix.env }}-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig (default, sticky) run a nested `pio run` from
          # ~/.platformio/penv. The platform bootstraps that penv with an open-ended
          # "pioarduino>=6.1.19", which now resolves to 6.2.0. That core wants
          # tool-scons 4.11.1 while platform 55.03.311 pins 4.8.1; the two keep
          # reinstalling over each other and the running SCons loses its package
          # mid-build ("No module named 'SCons.Tool.FortranCommon'"). Keep the penv
          # core on the same version as the outer core installed above.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e ${{ matrix.env }}
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build ${{ matrix.env }} firmware
        run: |
          set -euo pipefail
          pio run -e ${{ matrix.env }} | tee pio.log

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ASSET }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: error

      - name: Extract firmware stats
        id: stats
        continue-on-error: true
        env:
          STATS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse HEAD^1)"
          fi
          python3 .github/scripts/firmware-stats.py pio.log "${{ matrix.env }}" "$STATS_SHA" \
            ".pio/build/${{ matrix.env }}/firmware.bin" "$BASE_SHA" > firmware-stats.json
          {
            echo '## ${{ matrix.env }} firmware build stats'
            echo '```json'
            cat firmware-stats.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware stats
        if: steps.stats.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: firmware-stats-${{ matrix.env }}
          path: firmware-stats.json
          if-no-files-found: error

  unit-tests:
    name: Unit tests (${{ matrix.cc }})
    # Warnings fail this build, so pin the image and its compilers (GCC 13, Clang 18).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Warnings fail the host build, and GCC and Clang warn differently.
        include:
          - cc: gcc-13
            cxx: g++-13
          - cc: clang-18
            cxx: clang++-18
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # The browser test needs Node 22's global WebSocket.
      - uses: actions/setup-node@v4
        if: matrix.cc == 'gcc-13'
        with:
          node-version: '22'

      - name: Test firmware comment and measurements
        if: matrix.cc == 'gcc-13'
        run: |
          python3 -m unittest discover -s test -p test_firmware_stats.py
          node --test test/firmware_comment.test.js

      - name: Test web UI plugin navigation
        if: matrix.cc == 'gcc-13'
        timeout-minutes: 5
        # Ubuntu 24.04's AppArmor can block the user namespaces Chrome's sandbox needs.
        # The browser test uses the runner's preinstalled Chrome and skips without it.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node --test test/test_webui_plugin_navigation.cjs test/test_webui_plugin_navigation_browser.cjs

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Lint Python
        run: uvx ruff@0.16.9 check --output-format=github .

      - name: Check Python formatting
        run: uvx ruff@0.16.9 format --check --diff .

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install lint tools
        run: npm ci

      - name: Lint JavaScript
        run: npx eslint .
  # The host tests under AddressSanitizer (with leak checks) and UndefinedBehaviorSanitizer.
  # The parsers read untrusted EPUB, ZIP and XML input; any sanitizer report fails a test.
  sanitizers:
    name: Unit tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        # Instrumented code makes GCC emit false flow warnings; the unit-tests jobs enforce warnings.
        run: >-
          cmake -S test -B build/sanitize -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCROSSPOINT_SANITIZERS=ON -DCROSSPOINT_WERROR=OFF

      - name: Build
        run: cmake --build build/sanitize

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build/sanitize --output-on-failure -j

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - clang-tidy
      - cppcheck
      - eslint
      - ruff
      - unit-tests
      - sanitizers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
