name: Web preview

# Builds the simulator for the browser, tests it in headless Chromium, and
# deploys it to the crosspoint-sim Cloudflare Worker (test/simulator/wrangler.jsonc):
# a Worker Preview named pr-<number> for a pull request, deleted when the PR
# closes, and the Worker itself for develop. The PR comment links the Preview
# URL. The deploy steps are skipped until the CLOUDFLARE_API_TOKEN secret
# (Workers Scripts: Edit) and the CLOUDFLARE_ACCOUNT_ID variable are set.

on:
  push:
    branches: [develop]
  pull_request:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: web-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: '7.0.1'
  # Worker Previews need 4.135.0 or later; pinned so its output file format is stable.
  WRANGLER: wrangler@4.169.0
  WRANGLER_CONFIG: test/simulator/wrangler.jsonc

jobs:
  preview:
    name: Browser simulator preview
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    env:
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The PR head itself, not the merge with develop, so the preview
          # matches the commit named in the label and comment.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        # Same core as ci.yml; the i18n and HTML generators need pyyaml.
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "pyyaml>=6.0.2"

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build browser simulator
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          pio run -e simulator_web

      - name: Test the site assembler
        run: python3 -m unittest discover -s test/simulator -p 'test_web_site.py'

      - name: Assemble site
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short="${HEAD_SHA:0:7}"
          if [ -n "$PR_NUMBER" ]; then label="PR #$PR_NUMBER · $short"; else label="develop · $short"; fi
          python3 test/simulator/web_site.py .pio/build/simulator_web sim-site \
            --label "$label" --url "$PR_URL"
          echo "WASM_MB=$(python3 -c 'import os; print(round(os.path.getsize("sim-site/program.wasm") / 1e6, 1))')" >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: node test/simulator/web_smoke.mjs sim-site --out sim-web-artifacts

      - name: Upload screenshots and console log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: simulator-web-smoke
          path: sim-web-artifacts
          if-no-files-found: ignore

      - name: Deploy to Cloudflare Workers
        if: env.CAN_DEPLOY == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Wrangler writes one JSON line per command here; its stdout mixes in
          # upload progress.
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler.ndjson"
          if [ -n "$PR_NUMBER" ]; then
            cmd=(preview --name "pr-$PR_NUMBER")
            query='select(.type == "preview") | .preview_urls[0]'
          else
            cmd=(deploy)
            query='select(.type == "deploy") | .targets[0]'
          fi
          # One retry: two first runs can race to create the Worker.
          npx --yes "$WRANGLER" "${cmd[@]}" --config "$WRANGLER_CONFIG" --message "${HEAD_SHA:0:7}" \
            || { sleep 10; npx --yes "$WRANGLER" "${cmd[@]}" --config "$WRANGLER_CONFIG" --message "${HEAD_SHA:0:7}"; }
          url=$(jq -r "$query // empty" "$WRANGLER_OUTPUT_FILE_PATH" | tail -1)
          if [ -z "$url" ]; then
            echo "::error::could not find the preview URL in wrangler's output"
            exit 1
          fi
          case "$url" in https://*) ;; *) url="https://$url" ;; esac
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"

      - name: Comment preview link
        if: env.PREVIEW_URL != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- web-preview -->';
            const body = [
              marker,
              `**Browser simulator preview:** ${process.env.PREVIEW_URL}`,
              '',
              `Built from ${process.env.HEAD_SHA.slice(0, 7)}; program.wasm is ${process.env.WASM_MB} MB. ` +
                'Keys: Esc back, Enter confirm, arrows, P power. The SD card is kept in your browser; ' +
                'use "Reset SD card" on the page for a fresh one. Settings, files and caches carry over between pushes: if a book is laid out as in an older push, reset to rule out old settings; if it persists, a cache version bump may be missing. The web server, Wi-Fi and HTTP features do not work in the browser.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    name: Delete browser simulator preview
    # pull_request_target: GitHub runs no pull_request workflow when a PR with
    # a merge conflict closes. This job runs no code from the PR.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/setup-node@v6
        if: env.CAN_DEPLOY == 'true'
        with:
          node-version: '22'

      - name: Delete the PR's Worker Preview
        if: env.CAN_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          if npx --yes "$WRANGLER" preview delete --worker-name crosspoint-sim \
              --name "pr-$PR_NUMBER" --skip-confirmation 2>&1 | tee delete.log; then
            exit 0
          fi
          # A PR closed before its first deploy has no Preview; anything else fails.
          if grep -qiE 'not found|does not exist|10025' delete.log; then
            echo "No Preview pr-$PR_NUMBER to delete."
            exit 0
          fi
          exit 1
