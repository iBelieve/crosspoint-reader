name: Feature Request
description: Propose a new feature, app, or change for this fork
title: "Short, descriptive title of the request"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [SCOPE.md](https://github.com/iBelieve/crosspoint-reader/blob/develop/SCOPE.md) first.
        Browsers, RSS, media playback, PDF, and background Wi-Fi or tasks need the owner's approval.

  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: What problem does this solve on the device? Be concrete.
      placeholder: e.g., "When reading in landscape, paragraph breaks are inconsistent because..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: A short description of what you would build or change. Focus on user impact; implementation details can come later.
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: Memory / flash / complexity cost
      description: |
        The ESP32-C3 has about 380 KB of usable RAM. Roughly how much DRAM, flash, or code complexity does this add?
        "Don't know" is a valid answer, but please attempt an estimate.
      placeholder: e.g., "Adds ~2KB flash for the new font tables, no DRAM impact at runtime."
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else relevant (links, screenshots, related discussions).
    validations:
      required: false
